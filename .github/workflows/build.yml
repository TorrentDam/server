name: build
on: [ push ]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Setup dev environment
        run: nix develop . --command sh -c 'echo "$PATH" >> "$GITHUB_PATH"'
      - name: Compile
        run: mill __.compile
      - name: Build distributable
        run: mill server.assembly
      - name: Short revision hash
        id: rev
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images
        uses: docker/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/torrentdam/server:${{ steps.rev.outputs.short }}
            ghcr.io/torrentdam/server:${{ github.sha }}
            ghcr.io/torrentdam/server:latest
